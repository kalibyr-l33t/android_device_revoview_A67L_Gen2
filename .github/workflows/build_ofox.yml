name: Build OrangeFox Recovery (A67L_Gen2)

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: "OrangeFox branch (12.1 recommended for GitHub Actions disk limits)"
        required: true
        default: "12.1"
        type: choice
        options:
          - "12.1"
          - "14.1"
      lunch_target:
        description: "Exact lunch target (match PRODUCT_NAME in omni_A67L_Gen2.mk)"
        required: true
        default: "omni_A67L_Gen2-eng"
        type: string
      build_target:
        description: "Make target (recoveryimage, bootimage, or vendorbootimage)"
        required: true
        default: "vendorbootimage"
        type: choice
        options:
          - "recoveryimage"
          - "bootimage"
          - "vendorbootimage"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free Disk Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 bc bison build-essential ccache cpio curl flex \
            g++-multilib gcc-multilib git gnupg gperf liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush python3 python-is-python3 \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          sudo curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Configure Git & Sync OrangeFox
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          mkdir -p "$HOME/ofox_sync"
          git clone https://gitlab.com/OrangeFox/sync.git "$HOME/ofox_sync/sync"
          cd "$HOME/ofox_sync/sync"
          ./orangefox_sync.sh --branch "${{ inputs.fox_branch }}" --path "$HOME/fox_src"

          # Free ~15-20 GB of git metadata before compiling
          rm -rf "$HOME/fox_src/.repo"
          df -h

      - name: Place Device Tree
        run: |
          mkdir -p "$HOME/fox_src/device/revoview/A67L_Gen2"
          rsync -av --exclude='.git' --exclude='.github' "$GITHUB_WORKSPACE/" "$HOME/fox_src/device/revoview/A67L_Gen2/"

      - name: Compile OrangeFox
        shell: bash
        run: |
          cd "$HOME/fox_src"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE="A67L_Gen2"
          export FOX_AB_DEVICE=1
          export FOX_VENDOR_BOOT_RECOVERY=1
          set +e
          source build/envsetup.sh
          set -e
          lunch "${{ inputs.lunch_target }}"
          mka -j$(nproc) "${{ inputs.build_target }}"if [ "${{ inputs.build_target }}" = "vendorbootimage" ]; then
            mka -j$(nproc) adbd vendorbootimage
          else
            mka -j$(nproc) "${{ inputs.build_target }}"
          fi
          
      - name: Collect Output Files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out_artifacts"
          echo "=== Product directories ==="
          ls -la "$HOME/fox_src/out/target/product/"

          OUT_DIR=$(find "$HOME/fox_src/out/target/product" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "=== Contents of $OUT_DIR ==="
          ls -lh "$OUT_DIR"

          for f in OrangeFox-*.zip OrangeFox-*.img recovery.img boot.img vendor_boot.img; do
            cp -v "$OUT_DIR"/$f "$GITHUB_WORKSPACE/out_artifacts/" 2>/dev/null || true
          done

          echo "=== Collected artifacts ==="
          ls -lh "$GITHUB_WORKSPACE/out_artifacts"

          if [ -f "$GITHUB_WORKSPACE/out_artifacts/vendor_boot.img" ]; then
            SIZE=$(stat -c%s "$GITHUB_WORKSPACE/out_artifacts/vendor_boot.img")
            echo "vendor_boot.img size: $SIZE bytes"
            if [ "$SIZE" -lt 10000000 ]; then
              echo "ERROR: vendor_boot.img is under 10 MB — ramdisk is likely empty!"
              exit 1
            fi
          fi
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-A67L_Gen2-${{ inputs.fox_branch }}
          path: out_artifacts/*
          if-no-files-found: error
